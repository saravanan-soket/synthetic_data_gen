apiVersion: batch/v1
kind: Job
metadata: {name: cybergym-synthetic, namespace: eka-bench}
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 3
  backoffLimitPerIndex: 1
  maxFailedIndexes: 3
  activeDeadlineSeconds: 7200
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: kubernetes.io/hostname, operator: NotIn, values: [soketlab-worker002, soketlab-worker018]}
      containers:
      - name: agent
        image: python:3.12-bookworm
        resources: {requests: {cpu: "2", memory: 4Gi}, limits: {cpu: "4", memory: 10Gi}}
        env:
        - {name: SHARD_COUNT, value: "3"}
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef: {name: litellm-proxy-key, key: LITELLM_API_KEY}
        - name: LANGFUSE_HOST
          valueFrom:
            secretKeyRef: {name: cybergym-langfuse, key: LANGFUSE_HOST}
        - name: LANGFUSE_PUBLIC_KEY
          valueFrom:
            secretKeyRef: {name: cybergym-langfuse, key: LANGFUSE_PUBLIC_KEY}
        - name: LANGFUSE_SECRET_KEY
          valueFrom:
            secretKeyRef: {name: cybergym-langfuse, key: LANGFUSE_SECRET_KEY}
        command: ["bash","-lc"]
        args:
        - |
          TD=/projects/data/datasets/code_data/cyber_bench/synthetic_data_gen/run/tasks_glm_smoke
          for i in $(seq 1 24); do [ -d "$TD" ] && [ "$(ls "$TD" 2>/dev/null | wc -l)" -gt 0 ] && break; echo "waiting for data ($i)"; sleep 5; done
          [ -d "$TD" ] || { echo "DATA NOT VISIBLE on $(hostname)"; exit 1; }
          pip install --quiet openai httpx 2>&1 | tail -3
          python3 /app/agent_runner_glm.py \
            --tasks-dir $TD \
            --trace-dir /projects/data/datasets/code_data/cyber_bench/synthetic_data_gen/run/traces_glm_smoke \
            --poc-dir /projects/data/datasets/code_data/cyber_bench/synthetic_data_gen/run/pocs_glm_smoke \
            --base-url http://litellm-defensive-proxy.exploitbench.svc.cluster.local:4000/v1 \
            --model glm5.3-defense \
            --api-key "$LITELLM_API_KEY" \
            --concurrency 1 --max-turns 100 --bash-timeout 120 --task-deadline 3600
        volumeMounts:
        - {name: code, mountPath: /app}
        - {name: projects, mountPath: /projects/data}
      volumes:
      - {name: code, configMap: {name: agent-code-glm}}
      - {name: projects, hostPath: {path: /projects/data, type: Directory}}
