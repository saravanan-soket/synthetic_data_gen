[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exploitbench"
version = "0.1.0"
description = "ExploitBench agent loop trimmed for ARVO synthetic trajectory generation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Seunghyun Lee" },
    { name = "David Brumley", email = "contact@exploitbench.ai" },
]
keywords = ["benchmark", "llm", "security", "v8", "exploit", "ctf"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "anthropic>=0.40",
    # 1.83.14 bundles GPT-5.5 xhigh metadata. The GPT-5.4+ tools+reasoning
    # Chat Completions -> Responses bridge has existed since 1.82.2.
    "litellm>=1.83.14",
    # litellm's `completion_with_retries` (the path we hit when num_retries
    # is set) requires tenacity; not a hard dep of litellm itself.
    "tenacity>=8",
    "mcp>=1.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
exploitbench = "exploitbench.cli:app"

[tool.setuptools.packages.find]
include = ["exploitbench*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's standard pattern is `field: T = typer.Option(...)`; it requires
# the call in the default. Don't fight the framework here.
"exploitbench/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["exploitbench/tests"]
asyncio_mode = "auto"
markers = [
    "slow: requires Docker / network / real APIs",
    "golden: tier-2 parity tests",
]
